[tool.poetry]
name = "archcompinger"
version = "0.1.0"
description = "Mattermost bot that reminds @moac threads without a lens reaction"
authors = ["nofosforrr"]
packages = [{include = "archcompinger"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
aiohttp = "^3.9"
python-dotenv = "^1.0"

[tool.poetry.scripts]
archcompinger = "archcompinger.main:run"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
