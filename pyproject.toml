[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archcompinger"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.scripts]
archcompinger = "archcompinger.main:run"

[tool.ruff]
line-length = 100
